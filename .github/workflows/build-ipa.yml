name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build unsigned .ipa
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name '*.app' -maxdepth 3 | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r KuaiJi.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: KuaiJi-ipa
          path: KuaiJi.ipa
