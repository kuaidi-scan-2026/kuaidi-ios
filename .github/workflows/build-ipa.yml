name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build unsigned .ipa
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -60
      - name: Package .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name '*.app' -maxdepth 4 | head -1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r KuaiJi.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: KuaiJi-ipa
          path: KuaiJi.ipa
